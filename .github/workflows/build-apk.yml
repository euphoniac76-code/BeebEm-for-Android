name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships the Android SDK (ANDROID_HOME).
      - name: Accept SDK licences and install CMake used by the native build
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "cmake;4.1.2"

      # The C++ sources were written on case-insensitive file systems (macOS/Windows) and include
      # some headers with a different capitalisation from the real file. Linux needs exact names.
      - name: Add lower/upper-case header aliases
        working-directory: app/src/main/cpp
        run: |
          ln -sf Windows.h platform/windows.h
          ln -sf Sdl.h platform/SDL.h
          ln -sf Log.h core/log.h
          ln -sf Line.h core/line.h

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: beebem-gamepad-apk
          path: app/build/outputs/apk/debug/*.apk
